<p>product-http-handle-error-service-component works!</p>
{{errMessage()}}
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Hình ảnh</th>
        </tr>
    </thead>
    <tbody>
        @for (p of product(); track p.id) {
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td><img [src]="p.image" height="100px" width="100px"></td>
        </tr>
        }
        @empty{
        <tr>
            <td colspan="4">Not found product!!!</td>
        </tr>
        }
    </tbody>
</table>
