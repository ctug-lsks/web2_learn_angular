<p>product-list-call-service-component works!</p>
<div>
    Min price:<input type="number" name="minPrice" id="minPrice" [(ngModel)]="minPrice">
    Max price:<input type="number" name="maxPrice" id="maxPrice" [(ngModel)]="maxPrice">
    <button (click)="doFilterbyPrice()">Filter</button>
</div>
<ol>
    <li *ngFor="let product of products">
        {{product.name}} -VNĐ{{product.price}}
        <br>
        <img [src]="product.image" alt="product.name" width=100 height=100>
    </li>
</ol>
