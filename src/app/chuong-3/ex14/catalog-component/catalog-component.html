<p>catalog-component works!</p>
<table border="1">
    <thead>
        <tr>
            <td>Mã Danh Mục</td>
            <td>Tên Danh Mục</td>
        </tr>
    </thead>
    <tbody *ngFor="let c of products">
        <tr>
            <td>{{c.Cateid}}</td>
            <td>{{c.CateName}}</td>
        </tr>
        <tr>
            <td colspan="2">
                <table border="1">
                    <tr>
                        <td>Ma San Pham</td>
                        <td>Ten San Pham</td>
                        <td>Gia San Pham</td>
                        <td>Picture</td>
                    </tr>
                    <tr *ngFor="let p of c.Products">
                        <td>{{p.ProductId}}</td>
                        <td>{{p.ProductName}}</td>
                        <td>{{p.Price}}</td>
                        <td>
                            <img [src]="p.Image" width="50" height="50">
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </tbody>
</table>
