<p>group-customers works!</p>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>#</th>
        </tr>
    </thead>
    <tbody *ngFor="let t of customers()">
        <tr>
            <td colspan="5">
                {{t.CustomerTypeId}} - {{t.CustomerTypeName}}
            </td>
        </tr>
        <tr *ngFor="let c of t.Customers">
            <td>{{c.Id}}</td>
            <td>{{c.Name}}</td>
            <td>{{c.Email}}</td>
            <td>{{c.Age}}</td>
            <td><img [src]="c.Image" width="50" height="50"></td>
        </tr>
    </tbody>
</table>
