<div class="fashion-list-container container py-4">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-6 fw-bold text-dark mb-2">Fashion List</h1>
        </div>
    </div>

    <!-- Error Message Alert -->
    @if (errMessage()) {
    <div class="alert alert-danger shadow-sm d-flex align-items-center mb-4" role="alert">
        <div>
            <strong>Lỗi:</strong> {{ errMessage() }}
        </div>
    </div>
    }

    <!-- Fashion Cards Grid -->
    <div class="row g-4">
        @for (fashion of fashions(); track fashion.IdF || fashion._id) {
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 fashion-card">
                <!-- Card Image with Style Badge -->
                <div class="fashion-img-wrapper position-relative overflow-hidden cursor-pointer"
                    (click)="viewDetailSlug(fashion)">
                    <img [src]="getImageSrc(fashion)" class="card-img-top fashion-img" [alt]="fashion.fashion_subject"
                        loading="lazy">
                    @if (fashion.style) {
                    <div class="position-absolute top-0 start-0 m-3">
                        <span class="badge bg-dark bg-opacity-75 text-uppercase px-2.5 py-1.5 shadow-sm">
                            {{ fashion.style }}
                        </span>
                    </div>
                    }
                </div>

                <!-- Card Body -->
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="card-title fw-bold text-dark mb-3 line-clamp-2 cursor-pointer"
                        [title]="fashion.fashion_subject" (click)="viewDetailSlug(fashion)">
                        {{ fashion.fashion_subject }}
                    </h5>

                    <p class="card-text text-secondary mb-4 line-clamp-3 small flex-grow-1">
                        {{ fashion.fashion_detail }}
                    </p>

                    <!-- 2 Action Buttons: 1 bằng Slug, 1 bằng ID -->
                    <div class="d-flex gap-2 mt-auto">
                        <button
                            class="btn btn-dark flex-fill py-2 d-flex align-items-center justify-content-center gap-1"
                            (click)="viewDetailSlug(fashion)" title="Xem chi tiết bằng Slug SEO">
                            <span>Chi tiết (Slug)</span>
                            <span>→</span>
                        </button>
                        <button
                            class="btn btn-outline-dark flex-fill py-2 d-flex align-items-center justify-content-center gap-1"
                            (click)="viewDetail(fashion.IdF)" title="Xem chi tiết bằng IdF">
                            <span>Chi tiết (ID)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        } @empty {
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted">Đang tải danh sách thời trang...</p>
        </div>
        }
    </div>
</div>
